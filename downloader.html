<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClipHawk · Download</title>
  <link rel="icon" href="icons/cliphawk32.png">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="downloader.css">
</head>
<body class="downloader-page">
  <main class="download-wrap">
    <header class="download-header">
      <div class="brand"><img src="icons/cliphawk48.png" alt="" width="32" height="32"><span>Clip<b>Hawk</b></span></div>
      <span class="download-eyebrow">DOWNLOAD MANAGER</span>
    </header>
    <section class="download-panel" aria-labelledby="title">
      <div class="download-heading"><span class="state-pill" id="state">Preparing</span><span class="tag" id="format">STREAM</span></div>
      <h1 id="title">Getting your video ready</h1>
      <div class="source-line" id="source"></div>
      <div class="download-stats" aria-label="Transfer statistics">
        <div><span>Transferred</span><strong id="transferred">0 B</strong></div>
        <div><span>Average speed</span><strong id="speed">—</strong></div>
        <div><span>Elapsed</span><strong id="elapsed">0:00</strong></div>
      </div>
      <div id="tracks" class="download-tracks"></div>
      <div id="status" role="status" aria-live="polite">Reading the stream manifest…</div>
      <div class="download-actions">
        <button class="btn" id="pause" disabled>Pause</button>
        <button class="btn" id="retry" hidden>Retry download</button>
        <button class="btn ghost" id="cancel">Cancel download</button>
        <button class="btn ghost" id="close" hidden>Close tab</button>
      </div>
      <p class="download-help" id="control-hint">Keep this tab open until your files have been saved.</p>
    </section>
    <section class="download-panel saved-panel" id="saved" aria-labelledby="saved-heading" hidden>
      <h2 id="saved-heading">Your files</h2>
      <div id="files"></div>
    </section>
    <section class="download-panel hint-panel" id="hint" aria-labelledby="hint-heading" hidden>
      <div class="hint-heading"><h2 id="hint-heading">One more step</h2><button class="btn ghost" id="copy-command">Copy command</button></div>
      <p id="hint-description"></p>
      <pre id="command"></pre>
      <div class="note" id="copy-status" role="status"></div>
    </section>
    <p class="download-footnote">Made for the videos you want to keep.</p>
  </main>
  <script type="module" src="downloader.js"></script>
</body>
</html>
